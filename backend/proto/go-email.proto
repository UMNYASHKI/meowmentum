syntax = "proto3";
option csharp_namespace = "Meowmentum.Server.Dotnet.Proto.Email";
option go_package = "./email";

service EmailService {
  rpc RegistrationConfirmation (RegistrationConfirmationRequest) returns (RegistrationConfirmationResponse);
  rpc PasswordReset (PasswordResetRequest) returns (PasswordResetResponse);
  rpc DeadlineOneDayAlert (DeadlineOneDayAlertRequest) returns (DeadlineOneDayAlertResponse);
  rpc OverdueAlert (OverdueAlertRequest) returns (OverdueAlertResponse);
}

message RegistrationConfirmationRequest {
  string Email = 1;
  string Name = 2;
  string ConfirmationCode = 3;
}

message RegistrationConfirmationResponse {}

message PasswordResetRequest {
  string Email = 1;
  string Name = 2;
  string ConfirmationCode = 3;
}

message PasswordResetResponse {}

message DeadlineOneDayAlertRequest {
  string Email = 1;
  string Name = 2;
  string TaskName = 3;
  string TaskURL = 4;
}

message DeadlineOneDayAlertResponse {}

message OverdueAlertRequest {
  string Email = 1;
  string Name = 2;
  int32 TaskCount = 3;
}

message OverdueAlertResponse {}
